[workspace]
resolver = "2"
members = [
    "crates/pincer",
    "crates/pincer-contract",
    "crates/pincer-sdk",
    "crates/pincer-bindgen",
    "crates/pincer-testkit",
    "crates/pincer-e2e",
    "crates/pincer-uia",
    "crates/pincer-core",
    "crates/platform-macos",
    "crates/platform-windows",
    "crates/platform-linux",
    "crates/cursor-overlay",
    "crates/pincer-cursor-motion",
    "crates/cursor-theme-cli",
    "crates/pip-preview",
]

[workspace.package]
version = "0.35.4"
edition = "2021"
authors = ["trycua"]
license = "MIT"
repository = "https://github.com/ModCritic/pincer"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# zune-jpeg 0.5.15 accepts zune-core ^0.5, but zune-core 0.5.2 changed its
# disabled logging macros in a source-incompatible way. Keep fresh downstream
# resolution on the last compatible pair until zune-jpeg publishes its fix.
zune-core = "=0.5.1"
uniffi = "=0.31.0"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
zstd = "0.13"
chacha20poly1305 = { version = "0.11", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
coset = "0.4.2"
ciborium = "0.2.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
getrandom = "0.4"
fs2 = "0.4"
hmac = "0.12"

# Release: strip the symbol and string tables (13.5 MB of the 54.9 MB binary
# was .strtab plus .symtab), thin LTO, one codegen unit. Panics stay `unwind`:
# catch_unwind contains them at the X11 input boundary (platform-linux
# input/mod.rs), in session-end hooks (pincer-core session.rs) and across the
# C ABI (pincer-sdk abi.rs); `abort` would end the process instead. Stripped
# binaries print panic backtraces without function names.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# UniFFI 0.31 reads the UNIFFI_META_* items from the library's .symtab
# (uniffi_bindgen macro_metadata/extract.rs), not from .dynsym, so the SDK
# cdylib that scripts/generate-uniffi-bindings.mjs reads must keep it.
[profile.release.package.pincer-sdk]
strip = "none"

# Dev and test builds: line tables are enough for backtraces with file and
# line, the split debug info stays out of the link, and dependencies carry
# no debug info at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
