[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pincer-driver"
version = "0.35.4"
description = "Rust-backed Pincer SDK and bundled executable for client applications"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "TryCua", email = "hello@trycua.com" }
]
keywords = [
    "mcp",
    "computer-use",
    "automation",
    "accessibility",
    "screen-capture",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ModCritic/pincer"
Documentation = "https://github.com/ModCritic/pincer"
Repository = "https://github.com/ModCritic/pincer"
Issues = "https://github.com/ModCritic/pincer/issues"

[project.scripts]
pincer = "pincer_driver.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pincer_driver"]
artifacts = [
    "src/pincer_driver/bin/*",
    "src/pincer_driver/*.dylib",
    "src/pincer_driver/*.so",
    "src/pincer_driver/*.dll",
]
pure-python = false

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
